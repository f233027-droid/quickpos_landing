# [POS-15] [POS-16] QuickPOS CI/CD Pipeline

name: QuickPOS CI/CD Pipeline

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'fix/**'

jobs:

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv
          coverage: none

      - name: PHP Syntax Check
        run: |
          echo "Running PHP syntax checks..."
          php -l index.php
          php -l process_form.php
          php -l thank-you.php
          echo "All files passed syntax check!"

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: PHPStan Static Analysis
        run: |
          echo "Running PHPStan..."
          ./vendor/bin/phpstan analyse --level=3 index.php process_form.php thank-you.php --no-progress
          echo "PHPStan passed!"

      - name: Validate Commit Message Contains Jira ID
        run: |
          echo "Checking commit messages for Jira IDs..."
          COMMITS=$(git log origin/main..HEAD --pretty=format:"%s" 2>/dev/null || git log -1 --pretty=format:"%s")
          echo "$COMMITS"
          PATTERN="^\[POS-[0-9]+\]"
          FAILED=false
          while IFS= read -r msg; do
            if [[ -n "$msg" ]]; then
              if echo "$msg" | grep -qE "^Merge .* into "; then
                echo "SKIP merge commit: '$msg'"
                continue
              fi
              if ! echo "$msg" | grep -qE "$PATTERN"; then
                echo "ERROR: '$msg' missing [POS-XXX]"
                FAILED=true
              else
                echo "OK: '$msg'"
              fi
            fi
          done <<< "$COMMITS"
          if [ "$FAILED" = true ]; then
            exit 1
          fi
          echo "All commit messages valid!"

  automated-tests:
    name: Automated PHPUnit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Run PHPUnit Tests
        run: |
          echo "Running test suite..."
          ./vendor/bin/phpunit tests/ --testdox --colors=always
          echo "All tests passed!"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phpunit-test-results
          path: |
            tests/
            phpunit.xml
          retention-days: 7

  pipeline-status:
    name: Pipeline Status Summary
    runs-on: ubuntu-latest
    needs: [code-quality, automated-tests]
    if: always()
    steps:
      - name: Check Pipeline Result
        run: |
          if [ "${{ needs.code-quality.result }}" == "success" ] && \
             [ "${{ needs.automated-tests.result }}" == "success" ]; then
            echo "=========================================="
            echo " ALL CHECKS PASSED - Safe to merge!"
            echo "=========================================="
          else
            echo "=========================================="
            echo " PIPELINE FAILED - Do NOT merge!"
            echo " Code Quality: ${{ needs.code-quality.result }}"
            echo " Tests:        ${{ needs.automated-tests.result }}"
            echo "=========================================="
            exit 1
          fi
